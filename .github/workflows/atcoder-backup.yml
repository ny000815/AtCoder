name: AtCoder Backup

on:
  workflow_dispatch: # Manual run
  schedule:
    # 05:00 UTC daily (= midnight US Eastern Standard Time, UTC-5)
    - cron: '0 5 * * *'

jobs:
  run-script:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install cloudscraper beautifulsoup4

      - name: Run scraper
        run: python fetch_submissions.py

      - name: Commit and Push
        run: |
          git config user.name  "ny000815"
          git config user.email "66006097+ny000815@users.noreply.github.com"
          git add -A
          if ! git diff --staged --quiet; then
            git commit -m "Auto backup: $(date)"
            git push
          fi
